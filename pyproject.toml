[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hindsight"
version = "1.0.0"
description = "Closed-loop experimentation for automated YouTube channels: learn what actually drove views, then design the next test."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harsh" }]
keywords = ["youtube", "analytics", "automation", "creator-tools", "ab-testing"]

dependencies = [
    "numpy>=1.24.0",
    "google-api-python-client>=2.180.0",
    "google-auth>=2.40.0",
    "google-auth-oauthlib>=1.2.0",
    "click>=8.1.0",
    "Jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
hindsight = "hindsight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hindsight = ["templates/*.j2", "demo_catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
